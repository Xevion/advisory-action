name: Dependency advisories
description: >-
  Report dependency advisories against the merge base, so a change is judged on
  what it introduces rather than on what the branch already carried.

inputs:
  base-ref:
    description: >-
      Commit to treat as the baseline. Defaults to the merge base with the pull
      request's target branch. Without one, nothing is attributed and nothing blocks.
    required: false
    default: ""
  ignore-file:
    description: Path to the advisory ignore list.
    required: false
    default: .github/advisories.json
  bun-version:
    description: Bun version used to run the scanner and to audit JavaScript projects.
    required: false
    default: latest
  govulncheck-version:
    description: govulncheck version installed when a Go module is present.
    required: false
    default: latest

outputs:
  introduced:
    description: Advisories present at HEAD but not at the baseline.
    value: ${{ steps.scan.outputs.introduced }}
  resolved:
    description: Advisories present at the baseline but gone at HEAD.
    value: ${{ steps.scan.outputs.resolved }}
  total:
    description: All advisories at HEAD, after the ignore list is applied.
    value: ${{ steps.scan.outputs.total }}
  blocking:
    description: Advisories severe enough to fail, given each ecosystem's tier.
    value: ${{ steps.scan.outputs.blocking }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    # The baseline is scanned in a detached worktree, which needs real history.
    - name: Verify history depth
      shell: bash
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::warning::shallow clone; advisories cannot be attributed to this change. Use actions/checkout with fetch-depth: 0."
        fi

    # Each scanner is only worth installing where its ecosystem exists, and the
    # language toolchain itself is the caller's to set up.
    - name: Detect ecosystems
      id: detect
      shell: bash
      run: bun "${{ github.action_path }}/src/detect.ts"

    - name: Install govulncheck
      if: steps.detect.outputs.go == 'true'
      shell: bash
      run: |
        if ! command -v go >/dev/null; then
          echo "::error::go.mod is present but the Go toolchain is not. Add actions/setup-go before this action."
          exit 1
        fi
        go install "golang.org/x/vuln/cmd/govulncheck@${{ inputs.govulncheck-version }}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Install cargo-audit
      if: steps.detect.outputs.rust == 'true'
      uses: taiki-e/install-action@cargo-audit

    - name: Scan
      id: scan
      shell: bash
      env:
        ADVISORY_BASE_REF: ${{ inputs.base-ref }}
        ADVISORY_IGNORE_FILE: ${{ inputs.ignore-file }}
      run: bun "${{ github.action_path }}/src/scan.ts"
